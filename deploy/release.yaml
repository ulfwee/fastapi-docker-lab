app: fastapi-docker-lab
environment: production

image:
  registry: ghcr.io
  repository: ulfwee/fastapi-docker-lab
  tag: sha-7fe95015827d6ec905d0abd753db240d1a628646

container:
  port: 8000

health:
  path: /health

strategy:
  type: canary
  stages: [0, 10, 50, 100]

platforms:
  google_cloud_run:
    region: europe-west1
    resources:
      cpu: "1"
      memory: 512Mi
    scaling:
      min_instances: 0
      max_instances: 2

  azure_container_apps:
    region: westeurope
    resources:
      cpu: 0.5
      memory: 1Gi
    scaling:
      min_replicas: 0
      max_replicas: 2
